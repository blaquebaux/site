name: Update Tracker market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh public market snapshots
        run: node scripts/update-market-data.mjs
      - name: Commit updated snapshots
        run: |
          git config user.name "blaquebaux-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracker/macro.json tracker/options.json
          git diff --cached --quiet || git commit -m "Update Tracker market snapshots"
          git push
