name: Update Tracker market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh public market snapshots
        run: node scripts/update-market-data.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Refresh Bumble feed (redundant trigger; GitHub cron is unreliable alone)
        continue-on-error: true
        run: python3 scripts/bumble-feed.py
        env:
          BUMBLE_DIR: bumble
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit updated snapshots
        run: |
          git config user.name "blaquebaux-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracker/macro.json tracker/options.json bumble/feed.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update Tracker + Bumble feed"
            git pull --rebase origin main || true
            git push
          fi
