name: Update Bumble feed

on:
  workflow_dispatch:
  schedule:
    # hourly during US market hours on weekdays (13:00-21:00 UTC ~ 9am-5pm ET)
    - cron: "5 13-21 * * 1-5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bumble feed
        run: python3 scripts/bumble-feed.py
        env:
          BUMBLE_DIR: bumble
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit updated feed
        run: |
          git config user.name "blaquebaux-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bumble/feed.json
          git diff --cached --quiet || git commit -m "Update Bumble feed"
          git push
