name: Update Bumble feed

on:
  workflow_dispatch:
  # ride the briefings' reliable cloud-publish cadence: refresh the feed whenever a
  # briefing is published (the cloud trigger commits to bumble/briefings/, firing that
  # workflow, which this one then follows). GitHub cron below is a best-effort backup.
  workflow_run:
    workflows: ["Validate and publish reviewed briefings"]
    types: [completed]
  schedule:
    # uncongested minutes fire more reliably than :00/:05, but GitHub still throttles;
    # the scheduled cloud task (dispatch) is the primary intraday driver.
    - cron: "23,53 13-21 * * 1-5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bumble feed
        run: python3 scripts/bumble-feed.py
        env:
          BUMBLE_DIR: bumble
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit updated feed
        run: |
          git config user.name "blaquebaux-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bumble/feed.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update Bumble feed"
            git pull --rebase origin main || true
            git push
          fi
