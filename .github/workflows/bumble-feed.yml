name: Update Bumble feed

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort and may be delayed during periods of high load.
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bumble feed
        run: python3 scripts/bumble-feed.py
        env:
          BUMBLE_DIR: bumble
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Test feed transforms
        run: python3 tests/test_bumble_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "blaquebaux-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bumble/feed.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update Bumble feed"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi
