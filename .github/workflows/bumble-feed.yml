name: Update Bumble feed

on:
  workflow_dispatch:
  schedule:
    # twice hourly at uncongested minutes during US market hours on weekdays
    # (GitHub drops scheduled runs at :00/:05; :23 and :53 fire far more reliably)
    - cron: "23,53 13-21 * * 1-5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bumble feed
        run: python3 scripts/bumble-feed.py
        env:
          BUMBLE_DIR: bumble
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit updated feed
        run: |
          git config user.name "blaquebaux-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bumble/feed.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update Bumble feed"
            git pull --rebase origin main || true
            git push
          fi
