name: Validate and publish reviewed briefings
on:
  pull_request:
    paths: ['bumble/briefings/**', 'scripts/publish-briefings.py', 'scripts/ingest-briefing.py', 'tests/test_briefings.py', 'tests/test_ingest.py', '.github/workflows/briefings.yml']
  push:
    branches: [main]
    paths: ['bumble/briefings/**', 'scripts/publish-briefings.py', 'scripts/ingest-briefing.py', 'tests/test_briefings.py', 'tests/test_ingest.py', '.github/workflows/briefings.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: briefings-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_briefings.py
      - run: python3 tests/test_ingest.py
      - run: python3 scripts/publish-briefings.py
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/publish-briefings.py
      - name: Commit compiled archive
        id: archive
        run: |
          git config user.name "blaquebaux-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bumble/briefings.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish reviewed Bumble briefings"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages build explicitly
        if: steps.archive.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Record actionable failure summary
        if: failure()
        run: |
          echo '## BUMBLE publication failed' >> "$GITHUB_STEP_SUMMARY"
          echo "Edition inputs remain immutable. Retry this run after inspecting the failed step; do not replace an existing edition." >> "$GITHUB_STEP_SUMMARY"
