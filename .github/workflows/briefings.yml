name: Validate and publish reviewed briefings
on:
  pull_request:
    paths: ['bumble/briefings/**', 'scripts/publish-briefings.py', '.github/workflows/briefings.yml']
  push:
    branches: [main]
    paths: ['bumble/briefings/**', 'scripts/publish-briefings.py', '.github/workflows/briefings.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: briefings-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_briefings.py
      - run: python3 scripts/publish-briefings.py
      - name: Publish archive on main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "blaquebaux-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bumble/briefings.json
          git diff --cached --quiet || git commit -m "Publish reviewed Bumble briefings"
          git pull --rebase origin main
          git push origin HEAD:main
